# Visual style definitions (ADR 0023). Task P3-08, 2026-10-14.
#
# PROVENANCE
# ----------
# The *drawings* in this file (dash rhythms, arrowhead paths, fill tiles,
# shadow values) are Ferrogram's own work. They are our own approximations
# of the visual style collections Visio indexes from the LinePattern,
# BeginArrow/EndArrow, FillPattern and ShdwPattern cells. Nothing is traced
# from Visio output and nothing is extracted from any Microsoft binary
# (AGENTS.md section 4).
#
# What is *not* ours (derived facts, recorded in docs/sources.md):
# - Index semantics and ranges: the [MS-VSDX] per-cell value tables
#   (source 3) and the ShapeSheet cell reference (source 4):
#   LinePattern 0 = transparent, 1 = solid, 2..23 = assorted patterns,
#   254 = custom master; BeginArrow/EndArrow 0 = none, 1..45 = assorted
#   arrowheads, 254 = custom master (EndArrow uses BeginArrow's table);
#   FillPattern 0 = none, 1 = solid, 2..40 = assorted, 254 = custom;
#   ShdwPattern 0 = shadow hidden, 1 = shadow visible ([MS-VSDX]; the
#   ShapeSheet reference describes 0..40 as the fill-pattern collection);
#   BeginArrowSize/EndArrowSize 0..6 = size classes (very small .. colossal).
# - Fill and shadow pattern names (visNoFill, visSolid, visWideUpDiagonal,
#   ... visThinDiagonalCross, 0..24): the VisCellVals enumeration on
#   Microsoft Learn (source 2). Names appear in each `note`.
# - Dash rhythm proportions: measured by us from the small table figures of
#   the [MS-VSDX] per-cell value tables (source 3) and re-expressed in our
#   own numbers below. The figures are Microsoft's drawings; we commit only
#   these ratios and our own paths.
#
# Corpus observation (black-box, 2026-10-14; the 15 corpus .vsdx files):
# LinePattern 0/1/23, BeginArrow 0, EndArrow 0, FillPattern 0/1/24,
# ShdwPattern 0 (plus `Themed` values, resolved elsewhere). The .vsd corpus
# was not scanned (no parser yet). Every corpus index has an entry here.
#
# CONVENTIONS (the scene builder, P3-05, relies on these)
# -------------------------------------------------------
# - line_patterns.dashes: on/off lengths as multiples of the line width;
#   empty = solid; `invisible` hides the line (index 0).
# - line_ends.shape: our own path in unit coordinates: x = 0 is the tip at
#   the shape's vertex, x = 1 is the tail along the line, y = 0.5 is the
#   line centre. `width` scales y, `length` scales x, both as multiples of
#   the arrow size class (BeginArrowSize/EndArrowSize 0..6). `filled: true`
#   fills the path, `false` strokes it with the line stroke. `shape: none`
#   draws nothing (index 0).
# - fill_patterns: `kind: tile` repeats `tile` (our own path in the unit
#   tile box (0,0)-(1,1)) with pitch `spacing`, a multiple of the line
#   width. `filled: true` fills the tile shapes; `false` strokes them with
#   `tile_stroke_width`, a fraction of the tile box side (default 0.05).
#   `invert: true` marks tiles drawn in the background colour over a
#   foreground-coloured box (the visBackDots family); the builder swaps the
#   two colours for those.
# - shadows: dx/dy/blur are multiples of the line width; alpha is 0..1.
#   The builder scales them with the shadow cells (ShapeShdwOffsetX/Y,
#   ShapeShdwBlur, ...).
#
# Every entry carries a `note` describing the intent. "Close enough" is
# defined in ADR 0023; the later screenshot pass refines these numbers.

meta:
