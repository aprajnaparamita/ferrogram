[package]
name = "larrygram-web"
description = "Larrygram web app (wasm, built with trunk)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
# GUI stack (ADR 0030): eframe web runner over the L6 UI crate. The wasm
# binding crates in this tree are MPL-2.0 and allowed per-crate in
# deny.toml (ADR 0030, ADR 0003 amendment).
# The glow backend only (ADR 0030): no wgpu tree. `persistence` backs the
# settings store (ADR 0032).
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "web_screen_reader",
] }
larrygram-commands = { path = "../../crates/commands" }
larrygram-ui = { path = "../../crates/ui" }
larrygram-ui-spec = { path = "../../crates/ui-spec" }

# The wasm startup seam (ADR 0030): `wasm-bindgen-futures` drives the
# `WebRunner`, `web-sys` finds the canvas and reports startup failures
# on the browser console. MIT OR Apache-2.0 (already in the tree
# through eframe).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Window",
] }

[lints]
workspace = true
