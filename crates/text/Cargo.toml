[package]
name = "larrygram-text"
description = "Text layout for shape text blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
# Fonts and shaping (ADR 0024). Pure Rust, permissive, wasm-compatible.
# skrifa/harfrust replace ttf-parser/rustybuzz, which cargo deny flags as
# unmaintained (RUSTSEC-2026-0192, RUSTSEC-2026-0206).
larrygram-geom = { path = "../geom" }
skrifa = "0.48"
harfrust = "0.14"
unicode-linebreak = "0.1"

[dev-dependencies]
# The layout property tests (tests/layout_properties.rs), task P3-11
# (ADR 0027 section 6).
proptest = "1"

[lints]
workspace = true
