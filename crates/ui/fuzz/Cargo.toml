[package]
name = "larrygram-ui-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.larrygram-ui]
path = ".."

[dependencies.larrygram-ui-spec]
path = "../../ui-spec"

[dependencies.larrygram-commands]
path = "../../commands"

# Prevent this from interfering with workspaces (the cargo-fuzz way).
[workspace]
members = ["."]

[[bin]]
name = "settings_json"
path = "fuzz_targets/settings_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shortcuts_map"
path = "fuzz_targets/shortcuts_map.rs"
test = false
doc = false
bench = false
