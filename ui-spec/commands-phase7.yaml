# Proposed command ids for Phase 7 (docs/phase-7/README.md, task P7-02).
schema_version: 1
notes:
- Command ids used by ui-spec/layouts/*.yaml that ui-spec/commands.yaml lacks.
- Add them through the extractor's Larrygram-only list (OUR_COMMANDS, ADR 0028) with mapping_confidence
