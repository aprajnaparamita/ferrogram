# Per-crate line-coverage thresholds for `cargo xtask gate` (step 5).
#
# [thresholds]: minimum line coverage in percent, per package.
# [ratchet]:    coverage recorded at the end of the previous phase. The gate
#               fails if any crate drops below it. Update at a phase end with
#               `cargo xtask coverage --update-ratchet` and commit the result.
#
# A crate with zero instrumented lines (an empty placeholder) passes.

[thresholds]
larrygram-geom = 85.0
larrygram-model = 85.0
larrygram-vsdx = 85.0
larrygram-vsd-binary = 85.0
larrygram-shapesheet = 85.0
larrygram-commands = 85.0
larrygram-ui-spec = 85.0
larrygram-render = 75.0
larrygram-text = 75.0
larrygram-control = 50.0
larrygram-ui = 50.0
larrygram = 50.0
larrygram-cli = 50.0

[ratchet]
larrygram = 80.0
larrygram-cli = 96.8
larrygram-commands = 98.4
larrygram-geom = 100.0
larrygram-model = 99.7
larrygram-render = 98.5
larrygram-shapesheet = 97.0
larrygram-text = 98.9
larrygram-ui = 97.0
larrygram-ui-spec = 99.4
larrygram-vsd-binary = 100.0
larrygram-vsdx = 98.2
larrygram-web = 77.9
xtask = 93.4
