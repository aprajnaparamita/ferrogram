[package]
name = "ferrogram-ui"
description = "egui user interface: ribbon, canvas, panels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
# The GUI stack (ADR 0030): egui for widgets, rfd for native file dialogs
# (ADR 0036). Nothing below L6 sees these crates (ADR 0002). Licences
# checked by cargo deny. `default_fonts` bundles egui's own UFL-1.0 font
# for the chrome text (ADR 0030 "Fonts in the UI chrome").
egui = { version = "0.37", features = ["default_fonts"] }
rfd = "0.17"
ferrogram-commands = { path = "../commands" }
ferrogram-geom = { path = "../geom" }
ferrogram-model = { path = "../model" }
ferrogram-render = { path = "../render" }
ferrogram-ui-spec = { path = "../ui-spec" }
# The settings slot format (ADR 0032): `Settings` as JSON in the
# eframe storage key. MIT OR Apache-2.0 (already in the tree).
serde_json = "1"

# The wasm picker bridge (ADR 0036): `wasm-bindgen-futures` completes
# rfd's async upload dialog on the browser event loop and `web-sys`
# downloads the saved bytes (rfd has no wasm save). All are MIT OR
# Apache-2.0 (already in the tree through eframe; ADR 0030).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "HtmlElement",
    "Url",
    "Window",
] }

[dev-dependencies]
# Headless UI tests (ADR 0030, ADR 0037).
egui_kittest = "0.37"
# Counts pinned per layout (ADR 0037, P4-04).
insta = "1"
# Property tests (ADR 0037; the settings-slot round trip, P4-16).
proptest = "1"

[lints]
workspace = true
