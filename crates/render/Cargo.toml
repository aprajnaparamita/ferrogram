[package]
name = "ferrogram-render"
description = "Scene graph, PNG and SVG rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
# Scene graph backends and style data (ADR 0023, ADR 0025). Pure Rust and
# wasm-compatible; licences checked by cargo deny.
ferrogram-geom = { path = "../geom" }
ferrogram-model = { path = "../model" }
ferrogram-text = { path = "../text" }
tiny-skia = "0.12"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"

[lints]
workspace = true
