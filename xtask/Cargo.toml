[package]
name = "xtask"
description = "Ferrogram developer tasks: quality gate, coverage ratchet, layering check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
# rustls with the ring provider, but no bundled webpki-roots (that crate is
# CDLA-Permissive-2.0, not in deny.toml). We load the OS root store ourselves
# via rustls-native-certs below.
rustls-native-certs = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring"] }

# P1-03: Fluent UI ribbon extractor (ADR 0007, ADR 0009).
calamine = "0.36"        # MIT; xlsx reader (>=0.36 pulls in quick-xml >=0.41
                         # which clears cargo-deny's RUSTSEC advisories
                         # RUSTSEC-2024-0001 and RUSTSEC-2025-0004)
jsonschema = "0.18"      # MIT; JSON Schema validator
regex-lite = "0.1"       # MIT; small regex engine for the out-of-scope glob matcher
serde-saphyr = "0.0.16"  # MIT; pure-Rust YAML (replaces archived serde_yaml and
                         # advisory-flagged serde_yml; see ADR 0007)

[lints]
workspace = true
