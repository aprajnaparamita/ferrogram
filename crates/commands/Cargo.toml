[package]
name = "ferrogram-commands"
description = "Command registry, undo/redo and selection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
# The registry runs over the model, the renderer and the readers (ADR 0028),
# and takes its ids and layout kinds from the ui-spec data (ADRs 0006, 0029).
# `serde` is for the persisted `Settings` only (ADR 0029); `serde-saphyr`
# parses the embedded `ui-spec/commands.yaml` stub table into `serde_json`
# values (the same pair `ferrogram-ui-spec`'s loader uses). Licences checked
# by cargo deny.
ferrogram-geom = { path = "../geom" }
ferrogram-model = { path = "../model" }
ferrogram-render = { path = "../render" }
ferrogram-ui-spec = { path = "../ui-spec" }
ferrogram-vsdx = { path = "../vsdx" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
