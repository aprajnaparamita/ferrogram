# Selection contexts and where each command is available (docs/ui/contexts.md).
# Keyed by ui-spec/commands.yaml id; shared by every layout.
schema_version: 1
contexts:
- id: empty_page
  description: A drawing page with no shapes; nothing selected.
- id: shape_selected
  description: One ordinary 2-D shape selected.
  status: pending
- id: shapes_selected
  description: Two ordinary shapes selected.
- id: text_editing
  description: The text of one shape open for editing.
- id: connector_selected
  description: One dynamic connector, glued at both ends, selected.
  status: pending
- id: group_selected
  description: One group of two shapes selected.
- id: second_page
  description: A second, empty page is active; nothing selected.
- id: picture_selected
  description: One imported picture selected.
- id: container_selected
  description: One container selected.
- id: shapesheet_window
  description: A ShapeSheet window is the active window.
notes:
- enabled_in lists the contexts where the command is available. A context not listed means the command
  is greyed out there. Contexts marked pending have no data yet; until they do, treat shape_selected like
  group_selected minus the group-only commands, and connector_selected like shape_selected.
- 'This table is a target for the command registry''s enabled predicates, not a replacement for them:
  the registry stays the single source at run time (AGENTS.md section 6).'
